<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slovíčko</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
body{margin:0}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: one centred column — header, 6×5 tile grid, Czech QWERTZ keyboard pinned under it */
:root {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #1d2433;
  --muted: #6b7486;
  --line: #c9ced8;
  --key: #d8dce4;
  --hit: #2f8f5b;
  --near: #d69a1f;
  --miss: #7b8394;
  --on-state: #ffffff;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161f; --surface: #1b2130; --ink: #e8ebf1; --muted: #9099ab;
    --line: #353d50; --key: #2c3446; --hit: #3a9d67; --near: #c99022; --miss: #444c5e;
    --on-state: #ffffff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161f; --surface: #1b2130; --ink: #e8ebf1; --muted: #9099ab;
  --line: #353d50; --key: #2c3446; --hit: #3a9d67; --near: #c99022; --miss: #444c5e;
  --on-state: #ffffff; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  -webkit-tap-highlight-color: transparent;
}
.app {
  max-width: 500px; margin: 0 auto; min-height: 100%;
  display: flex; flex-direction: column; gap: 14px; padding-block: 14px 12px;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 {
  font-family: var(--display); font-weight: 800; font-size: 1.9rem; margin: 0; letter-spacing: -0.02em;
  display: flex; align-items: baseline; gap: 2px;
}
h1 .dot { color: var(--hit); }
.sub { margin: 2px 0 0; color: var(--muted); font-size: 0.85rem; }
.btns { display: flex; gap: 8px; }
.ghost {
  font: 700 0.85rem var(--body); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer;
}
.ghost:hover { border-color: var(--muted); }
button:focus-visible { outline: 3px solid var(--near); outline-offset: 2px; }

.board-wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
.board {
  display: grid; grid-template-rows: repeat(6, 1fr); gap: 6px;
  width: min(100%, 330px);
}
.row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.tile {
  aspect-ratio: 1; max-width: 100%;
  display: grid; place-items: center;
  font: 800 1.9rem var(--display); text-transform: uppercase;
  border: 2px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink);
  user-select: none;
}
.tile.filled { border-color: var(--muted); animation: pop .1s ease-out; }
.tile.hit  { background: var(--hit);  border-color: var(--hit);  color: var(--on-state); }
.tile.near { background: var(--near); border-color: var(--near); color: var(--on-state); }
.tile.miss { background: var(--miss); border-color: var(--miss); color: var(--on-state); }
.tile.flip { animation: flip .45s ease-in-out both; }
.row.shake { animation: shake .4s; }
.tile.win { animation: hop .5s ease both; }
@keyframes pop { 50% { transform: scale(1.08); } }
@keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
@keyframes hop { 40% { transform: translateY(-14px); } 100% { transform: translateY(0); } }

.kb { display: flex; flex-direction: column; gap: 6px; user-select: none; }
.kr { display: flex; gap: 4px; justify-content: center; }
.key {
  flex: 1 1 0; min-width: 0; height: 50px; max-width: 44px;
  font: 700 1rem var(--body); color: var(--ink); background: var(--key);
  border: 0; border-radius: 6px; cursor: pointer; padding: 0;
  display: grid; place-items: center;
}
.key.wide { max-width: 68px; flex-grow: 1.6; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }
.key.diac { height: 40px; }
.key.hit  { background: var(--hit);  color: var(--on-state); }
.key.near { background: var(--near); color: var(--on-state); }
.key.miss { background: var(--miss); color: var(--on-state); opacity: .75; }
.key:active { transform: translateY(1px); }

.toast {
  position: fixed; left: 50%; top: calc(80px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); font-weight: 700; padding: 10px 16px; border-radius: 8px;
  z-index: 20; pointer-events: none; max-width: calc(100% - 32px); text-align: center;
}

.sheet-bg {
  position: fixed; inset: 0; background: rgba(10, 14, 22, .55); z-index: 30;
  display: grid; place-items: center; padding: 16px;
}
.sheet {
  background: var(--surface); color: var(--ink); border-radius: 14px; padding: 22px;
  width: min(100%, 380px); display: flex; flex-direction: column; gap: 14px;
  box-shadow: 0 20px 50px rgba(0,0,0,.3);
}
.sheet h2 { font: 800 1.5rem var(--display); margin: 0; text-wrap: balance; }
.sheet p { margin: 0; line-height: 1.5; color: var(--muted); }
.answer { font: 800 1.6rem var(--display); letter-spacing: .12em; color: var(--ink); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
.stats b { display: block; font: 800 1.6rem var(--display); font-variant-numeric: tabular-nums; }
.stats span { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.dist { display: flex; flex-direction: column; gap: 4px; }
.bar { display: grid; grid-template-columns: 14px 1fr; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; font-size: .85rem; }
.bar i { display: block; background: var(--miss); color: var(--on-state); font-style: normal; font-weight: 700; padding: 2px 6px; border-radius: 3px; text-align: right; min-width: 22px; }
.bar i.now { background: var(--hit); }
.primary {
  font: 700 1rem var(--body); background: var(--hit); color: var(--on-state); border: 0;
  border-radius: 10px; padding: 12px; cursor: pointer;
}
.legend { display: flex; flex-direction: column; gap: 8px; }
.legend div { display: flex; align-items: center; gap: 10px; color: var(--ink); }
.legend .tile { width: 34px; font-size: 1.1rem; flex: none; }

@media (max-height: 640px) { .key { height: 44px; } .key.diac { height: 34px; } .tile { font-size: 1.5rem; } .board { width: min(100%, 270px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
.tabs { display: flex; gap: 4px; background: var(--key); padding: 4px; border-radius: 999px; align-self: center; }
.tab {
  font: 700 0.85rem var(--body); color: var(--muted); background: transparent; border: 0;
  padding: 7px 16px; border-radius: 999px; cursor: pointer;
}
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.status { text-align: center; color: var(--muted); font-size: 0.85rem; min-height: 1.2em; margin: -6px 0 0; font-variant-numeric: tabular-nums; }
.status b { color: var(--ink); }
.status button { font: 700 0.85rem var(--body); color: var(--hit); background: none; border: 0; cursor: pointer; padding: 0 0 0 6px; text-decoration: underline; }
.row-btns { display: flex; gap: 8px; }
.row-btns .primary { flex: 1; }
.secondary {
  flex: 1; font: 700 1rem var(--body); background: var(--key); color: var(--ink); border: 0;
  border-radius: 10px; padding: 12px; cursor: pointer;
}
.countdown { text-align: center; color: var(--muted); font-size: 0.9rem; }
.countdown b { display: block; font: 800 1.6rem var(--display); color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.copybox { width: 100%; min-height: 120px; font: 1rem/1.3 var(--body); background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; box-sizing: border-box; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Slovíčko<span class="dot">.</span></h1>
      <p class="sub" id="sub">Uhodni české slovo o 5 písmenech na 6 pokusů</p>
    </div>
    <div class="btns">
      <button class="ghost" id="helpBtn" aria-label="Jak hrát">?</button>
      <button class="ghost" id="statsBtn">Skóre</button>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabDaily" aria-selected="true">Dnešní slovo</button>
    <button class="tab" role="tab" id="tabTrain" aria-selected="false">Trénink</button>
  </div>
  <p class="status" id="status"></p>

  <div class="board-wrap"><div class="board" id="board" aria-label="Hrací plocha"></div></div>

  <div class="kb" id="kb" aria-label="Klávesnice"></div>
</div>

<div class="toast" id="toast" hidden></div>
<div class="sheet-bg" id="sheetBg" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
// Slova pro denní hru v pevném zamíchaném pořadí. Den 1 = 28. 10. 2026.
const RAW = `písmo cihla maska dřevo vědec brada vlhko brouk prkno mraky socha kapsa pohár močál obruč mozek údolí lžíce lékař šířka karty opice přání kovář video vlast večer srnka peron vláda balet šunka panoš hrnek město větev hudba sauna západ hymna kašel linka husle sršeň salám osada jedle klaun jelen perla start firma želva chyba sucho chrám kotva žalud miska taťka banjo tůňka houba motýl datle pilot papír vesta mamka míček hádka párty hříbě štěně popel výlet talíř lekno nákup židle ořech šiška pátek blůza opera kabel kužel papež sukně tikot zubař kvádr vydra šroub lustr mušle cesta slovo holub zámek volby zajíc vlasy losos objem kaple párek návrh pánev loďka mobil triko národ lvice rádio nápad kočár mlýny sirup koala pirát jehla šakal lilek lišák kanár vagón motor sklář rákos bratr vlaky koník pupek krtek stěna svaly kozel trdlo kabát duben plány pošta tesař tuleň krysa batoh císař kolej kůlna taška salát úterý román vrata mléko javor říjen bazén lovec srdce autor oceán oblak banán hroch bříza seník pláně teplo skříň pupen balík tunel výška rajče mrkev kruhy kojot metro domov palec komár vážka šance tráva látka bubny myšák barva dívka pecen klika mýdlo lampa rytíř tchán guláš šátek matka třída pilka herec těsto paměť kečup hrnec hrabě koule banka nanuk kočka týden duchy chléb budík kolík jehně hrách písek řádek panda kámen čočka pasta bláto hasič pizza dárce brzda kořen tyčka dílna divák šachy nemoc beran helma chlad vánek panák tuňák sport hlína lilie labuť daněk brýle potok vývar nožík robot sklep taxík vejce mango župan zebra hosté štika srpen strom hrady okruh fenek zlato kufry kaňon garáž višeň kopec játra skála práce hrábě listí hokej kobka chlév princ kosti ježek sluha kokos louže kamna výhra řidič škola mnich smích dopis chata kráva malíř stráň hůlka včela celer závěs lůžko sokol kmotr brána drozd tenis závod pomoc obočí prach blesk věšák komín svetr prase myška ulice prsty délka leden láska palác máslo víčko fotka hlava dýmka horko sleva právo louky mince vrána vrták číslo sopka liška záliv holka nůžky lemur hotel řetěz deník plíce vozík anděl řízek atlas pekař koláč nehty povel hrnce klíče krůta tanec rybka obraz počet život měsíc buben sumec lekce baron bouře dárek sešit jazyk ptáče hyena datel beton jídlo okoun kniha sklad dveře sever žabka záhon křída rybář strýc kakao louka bunda loket disko zákon květy tužka harfa maják píseň konev obvod akord kapka švagr`;
const WORDS = RAW.split(/\s+/).filter(Boolean).map(w => w.toLocaleUpperCase('cs'));
const EPOCH = Date.UTC(2026, 9, 28);

const ROWS = 6, LEN = 5;
const KB = [
  ['Ě','Š','Č','Ř','Ž','Ý','Á','Í','É','Ú'],
  ['Q','W','E','R','T','Z','U','I','O','P'],
  ['A','S','D','F','G','H','J','K','L','Ů','Ó'],
  ['ENTER','Y','X','C','V','B','N','M','Ď','Ť','Ň','⌫']
];
const LETTER = /^[A-ZÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ]$/;
const EMOJI = { hit: '🟩', near: '🟨', miss: '⬛' };

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

function todayIndex() {
  const n = new Date();
  return Math.floor((Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) - EPOCH) / 86400000);
}
function dailyWord(day) { return WORDS[((day % WORDS.length) + WORDS.length) % WORDS.length]; }

let stats = store.get('slovicko-stats-v2', { played: 0, won: 0, streak: 0, best: 0, dist: [0,0,0,0,0,0], lastDay: null, lastWonDay: null });

let mode = 'daily', day, answer, guesses, results, current, over, won, busy;
const boardEl = document.getElementById('board'), kbEl = document.getElementById('kb');
const statusEl = document.getElementById('status');

function buildBoard() {
  boardEl.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    const row = document.createElement('div'); row.className = 'row';
    for (let c = 0; c < LEN; c++) { const t = document.createElement('div'); t.className = 'tile'; row.appendChild(t); }
    boardEl.appendChild(row);
  }
}
function buildKb() {
  kbEl.innerHTML = '';
  KB.forEach((r, i) => {
    const row = document.createElement('div'); row.className = 'kr';
    r.forEach(k => {
      const b = document.createElement('button'); b.className = 'key';
      if (i === 0) b.classList.add('diac');
      if (k === 'ENTER' || k === '⌫') b.classList.add('wide');
      b.textContent = k === 'ENTER' ? 'Hádat' : k;
      if (k === '⌫') b.setAttribute('aria-label', 'Smazat');
      b.dataset.k = k; row.appendChild(b);
    });
    kbEl.appendChild(row);
  });
}
kbEl.addEventListener('click', e => { const b = e.target.closest('.key'); if (b) { press(b.dataset.k); b.blur(); } });
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (!sheetBg.hidden) { if (e.key === 'Escape') closeSheet(); return; }
  if (e.key === 'Enter') { e.preventDefault(); press('ENTER'); }
  else if (e.key === 'Backspace') press('⌫');
  else { const k = e.key.toLocaleUpperCase('cs'); if (LETTER.test(k)) press(k); }
});

function resetBoard() {
  guesses = []; results = []; current = []; over = false; won = false; busy = false;
  buildBoard(); buildKb();
}
function startDaily() {
  mode = 'daily'; day = todayIndex(); answer = dailyWord(day);
  resetBoard();
  const saved = store.get('slovicko-den', null);
  if (saved && saved.day === day && Array.isArray(saved.guesses)) {
    saved.guesses.forEach((g, r) => {
      const word = [...g], res = score(word, [...answer]);
      paintRow(r, word, res, false); guesses.push(word); results.push(res); colorKeys(word, res);
    });
    won = results.length > 0 && results[results.length - 1].every(x => x === 'hit');
    over = won || guesses.length === ROWS;
  }
  updateStatus();
}
function startTraining() {
  mode = 'train';
  let pick; do { pick = WORDS[Math.floor(Math.random() * WORDS.length)]; } while (pick === answer || pick === dailyWord(todayIndex()));
  answer = pick;
  resetBoard(); updateStatus();
}
function setTab(m) {
  document.getElementById('tabDaily').setAttribute('aria-selected', m === 'daily');
  document.getElementById('tabTrain').setAttribute('aria-selected', m === 'train');
  m === 'daily' ? startDaily() : startTraining();
}
document.getElementById('tabDaily').onclick = () => setTab('daily');
document.getElementById('tabTrain').onclick = () => setTab('train');

function updateStatus() {
  if (mode === 'daily') {
    statusEl.innerHTML = over
      ? `Slovíčko č. ${day + 1} je hotové <button id="stShow">Výsledek</button>`
      : `Slovíčko č. <b>${day + 1}</b> · stejné slovo pro všechny`;
    const b = document.getElementById('stShow'); if (b) b.onclick = () => showStats('end');
  } else {
    statusEl.innerHTML = `Náhodné slovo, nepočítá se do skóre <button id="stNew">Nové slovo</button>`;
    document.getElementById('stNew').onclick = startTraining;
  }
}

function rowEl(r) { return boardEl.children[r]; }
function paintCurrent() {
  const tiles = rowEl(guesses.length).children;
  for (let i = 0; i < LEN; i++) { tiles[i].textContent = current[i] || ''; tiles[i].classList.toggle('filled', !!current[i]); }
}
function paintRow(r, word, res, animate) {
  const tiles = rowEl(r).children;
  word.forEach((ch, i) => {
    tiles[i].textContent = ch;
    if (!animate) { tiles[i].classList.add(res[i]); return; }
    setTimeout(() => { tiles[i].classList.add('flip'); setTimeout(() => tiles[i].classList.add(res[i]), 220); }, i * 260);
  });
}
const RANK = { miss: 1, near: 2, hit: 3 };
function colorKeys(word, res) {
  word.forEach((ch, i) => {
    const key = kbEl.querySelector(`[data-k="${ch}"]`); if (!key) return;
    const prev = ['hit','near','miss'].find(c => key.classList.contains(c));
    if (!prev || RANK[res[i]] > RANK[prev]) { key.classList.remove('hit','near','miss'); key.classList.add(res[i]); }
  });
}
function press(k) {
  if (over || busy) return;
  if (k === '⌫') { current.pop(); paintCurrent(); return; }
  if (k === 'ENTER') { submit(); return; }
  if (current.length < LEN) { current.push(k); paintCurrent(); }
}
function score(guess, target) {
  const res = Array(LEN).fill('miss'), left = {};
  for (let i = 0; i < LEN; i++) { if (guess[i] === target[i]) res[i] = 'hit'; else left[target[i]] = (left[target[i]] || 0) + 1; }
  for (let i = 0; i < LEN; i++) { if (res[i] !== 'hit' && left[guess[i]]) { res[i] = 'near'; left[guess[i]]--; } }
  return res;
}
function submit() {
  const r = guesses.length;
  if (current.length < LEN) { toast('Slovo musí mít 5 písmen'); shake(r); return; }
  if (mode === 'daily' && day !== todayIndex()) { toast('Začal nový den, načítám nové slovo'); setTimeout(startDaily, 900); return; }
  const word = current.slice(), res = score(word, [...answer]);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  busy = true;
  paintRow(r, word, res, !reduce);
  guesses.push(word); results.push(res); current = [];
  if (mode === 'daily') store.set('slovicko-den', { day, guesses: guesses.map(g => g.join('')) });
  setTimeout(() => {
    colorKeys(word, res); busy = false;
    won = res.every(x => x === 'hit');
    if (won || guesses.length === ROWS) finish(r);
  }, reduce ? 0 : LEN * 260 + 250);
}
function finish(r) {
  over = true;
  if (mode === 'daily' && stats.lastDay !== day) {
    stats.played++; stats.lastDay = day;
    if (won) {
      stats.won++; stats.dist[r]++;
      stats.streak = stats.lastWonDay === day - 1 ? stats.streak + 1 : 1;
      stats.best = Math.max(stats.best, stats.streak); stats.lastWonDay = day;
    } else stats.streak = 0;
    store.set('slovicko-stats-v2', stats);
  }
  if (won) {
    [...rowEl(r).children].forEach((t, i) => { t.style.animationDelay = (i * 90) + 'ms'; t.classList.remove('flip'); void t.offsetWidth; t.classList.add('win'); });
    toast(['Génius!','Skvělé!','Výborně!','Pěkně!','Uf, dobrý!','Na poslední chvíli!'][r]);
  }
  updateStatus();
  setTimeout(() => showStats('end'), 1300);
}
function shake(r) { const el = rowEl(r); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 1800);
}

const sheetBg = document.getElementById('sheetBg'), sheet = document.getElementById('sheet');
let cdTimer;
function openSheet(html) { sheet.innerHTML = html; sheetBg.hidden = false; const b = sheet.querySelector('button'); b && b.focus(); }
function closeSheet() { sheetBg.hidden = true; clearInterval(cdTimer); }
sheetBg.addEventListener('click', e => { if (e.target === sheetBg) closeSheet(); });

function untilMidnight() {
  const n = new Date(), m = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1);
  const s = Math.max(0, Math.floor((m - n) / 1000));
  return [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map(x => String(x).padStart(2, '0')).join(':');
}
function shareText() {
  const head = `Slovíčko č. ${day + 1}  ${won ? guesses.length : 'X'}/6`;
  const grid = results.map(r => r.map(x => EMOJI[x]).join('')).join('\n');
  const url = location.protocol.startsWith('http') && !location.hostname.endsWith('claude.ai') && !location.hostname.endsWith('claudeusercontent.com') ? '\n' + location.origin + location.pathname : '';
  return `${head}\n\n${grid}${url}`;
}
async function share() {
  const text = shareText();
  if (navigator.share && matchMedia('(pointer: coarse)').matches) {
    try { await navigator.share({ text }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(text); toast('Výsledek zkopírován, vlož ho do zprávy'); }
  catch {
    const box = document.createElement('textarea'); box.className = 'copybox'; box.value = text; box.readOnly = true;
    sheet.insertBefore(box, sheet.lastElementChild); box.focus(); box.select();
    toast('Označeno, zkopíruj pomocí Ctrl+C');
  }
}

function showStats(kind) {
  const pct = stats.played ? Math.round(stats.won / stats.played * 100) : 0;
  const max = Math.max(1, ...stats.dist);
  const ended = kind === 'end' && over;
  const winRow = ended && won ? guesses.length - 1 : -1;
  let head = '<h2>Tvoje skóre</h2><p>Počítají se jen hry s dnešním slovem.</p>';
  if (ended) head = won
    ? `<h2>Uhodnuto na ${guesses.length}. pokus</h2><div class="answer">${answer}</div>`
    : `<h2>Tentokrát to nevyšlo</h2><p>Hledané slovo bylo</p><div class="answer">${answer}</div>`;
  const bars = stats.dist.map((n, i) => `<div class="bar"><span>${i+1}</span><i class="${mode === 'daily' && i === winRow ? 'now' : ''}" style="width:${Math.max(8, n/max*100)}%">${n}</i></div>`).join('');
  let actions;
  if (ended && mode === 'daily') actions = `
    <div class="countdown">Další slovo za<b id="cd">${untilMidnight()}</b></div>
    <div class="row-btns"><button class="primary" id="shareBtn">Sdílet výsledek</button><button class="secondary" id="trainBtn">Trénink</button></div>`;
  else if (ended) actions = `<div class="row-btns"><button class="primary" id="againBtn">Další slovo</button><button class="secondary" id="closeBtn">Zavřít</button></div>`;
  else actions = `<button class="primary" id="closeBtn">Hrát dál</button>`;
  openSheet(`${head}
    <div class="stats">
      <div><b>${stats.played}</b><span>Her</span></div>
      <div><b>${pct}%</b><span>Výher</span></div>
      <div><b>${stats.streak}</b><span>Série</span></div>
      <div><b>${stats.best}</b><span>Nejlepší</span></div>
    </div>
    <div class="dist">${bars}</div>
    ${actions}`);
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on('shareBtn', share);
  on('trainBtn', () => { closeSheet(); setTab('train'); });
  on('againBtn', () => { closeSheet(); startTraining(); });
  on('closeBtn', closeSheet);
  if (document.getElementById('cd')) {
    cdTimer = setInterval(() => {
      const el = document.getElementById('cd'); if (!el) return clearInterval(cdTimer);
      el.textContent = untilMidnight();
      if (mode === 'daily' && todayIndex() !== day) { closeSheet(); startDaily(); toast('Je tu nové slovo!'); }
    }, 1000);
  }
}
function showHelp() {
  openSheet(`<h2>Jak hrát</h2>
    <p>Každý den je jedno nové slovo, stejné pro všechny. Napiš libovolné slovo o 5 písmenech a potvrď tlačítkem Hádat. Háčky a čárky se počítají jako samostatná písmena, takže E a Ě nejsou totéž.</p>
    <div class="legend">
      <div><span class="tile hit">K</span> písmeno je ve slově na správném místě</div>
      <div><span class="tile near">O</span> písmeno ve slově je, ale jinde</div>
      <div><span class="tile miss">Z</span> písmeno ve slově není</div>
    </div>
    <p>Hledaná slova jsou běžná podstatná jména. Po dohrání můžeš sdílet výsledek nebo si zahrát Trénink s náhodnými slovy.</p>
    <button class="primary" id="ok">Jdu hrát</button>`);
  document.getElementById('ok').onclick = closeSheet;
}
document.getElementById('statsBtn').onclick = () => showStats(over && mode === 'daily' ? 'end' : 'view');
document.getElementById('helpBtn').onclick = showHelp;
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && mode === 'daily' && day !== todayIndex() && !busy) { closeSheet(); startDaily(); }
});

startDaily();
if (!store.get('slovicko-seen', false)) { store.set('slovicko-seen', true); setTimeout(showHelp, 300); }
else if (over) setTimeout(() => showStats('end'), 300);
</script>
</body>
