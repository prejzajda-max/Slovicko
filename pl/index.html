/* Layout: one centred column — header, mode tabs, 6×5 tile grid, Czech QWERTZ keyboard under it.
   Vzhledy (skins) only redefine tokens; components read tokens. Klasický follows the system theme, the others commit to one look. */
:root {
  --bg: #eef0f3; --page: none; --surface: #ffffff; --ink: #1d2433; --muted: #6b7486; --line: #c9ced8;
  --key: #d8dce4; --key-ink: var(--ink); --key-shadow: none; --key-radius: 6px;
  --hit: #2f8f5b; --near: #d69a1f; --miss: #7b8394; --on-hit: #ffffff; --on-near: #ffffff; --on-miss: #ffffff;
  --tile-bg: var(--surface); --tile-line: var(--line); --tile-filled: var(--muted); --tile-style: solid; --tile-radius: 6px;
  --tile-shadow: none; --state-shadow: none; --tile-glow: none;
  --tile-font: var(--display); --tile-weight: 800; --tile-size: 1.85rem;
  --title-font: var(--display); --title-weight: 800; --title-size: 1.75rem; --accent: var(--hit); --link: var(--hit);
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-skin]) { --bg: #12161f; --surface: #1b2130; --ink: #e8ebf1; --muted: #9099ab; --line: #353d50; --key: #2c3446;
          --hit: #3a9d67; --near: #c99022; --miss: #444c5e; color-scheme: dark; }
}
/* Školní sešit: linkovaný papír, modrý inkoust, zvýrazňovače */
:root[data-skin="sesit"] {
  --bg: #fbf8ef; --page: linear-gradient(90deg, transparent 9px, #eaa6a2 9px 11px, transparent 11px), repeating-linear-gradient(180deg, transparent 0 27px, #cfdcf0 27px 28px);
  --surface: #fffdf7; --ink: #1f2f6b; --muted: #5d6b94; --line: #b9c7e2; --key: #efe8d6; --key-shadow: 0 2px 0 #d3c7a6; --key-radius: 4px;
  --hit: #8fdc9b; --near: #ffe169; --miss: #ddd8cb; --on-hit: #1f2f6b; --on-near: #1f2f6b; --on-miss: #6b7090;
  --tile-bg: rgba(255,255,255,.65); --tile-line: #a9bde0; --tile-filled: #1f2f6b; --tile-radius: 3px;
  --tile-font: "Caveat", "Segoe Print", cursive; --tile-weight: 700; --tile-size: 2.5rem;
  --title-font: "Caveat", "Segoe Print", cursive; --title-weight: 700; --title-size: 2.4rem; --accent: #d9534f; --link: #2e7d4f;
}
/* Česká klasika: krémový papír, dřevěné kostky, slabé zrno */
:root[data-skin="klasika"] {
  --bg: #f1e6d0; --page: radial-gradient(rgba(110,70,30,.07) 1px, transparent 1.4px) 0 0 / 5px 5px;
  --surface: #fbf5e8; --ink: #3b2616; --muted: #7d6450; --line: #d8c5a3; --key: #e8d6b5; --key-shadow: 0 3px 0 #b8996b; --key-radius: 8px;
  --hit: #4f7f3a; --near: #d39b2a; --miss: #8c7b67; --on-hit: #fff8ec; --on-near: #fff8ec; --on-miss: #fff8ec;
  --tile-bg: linear-gradient(160deg, #f3ddb5, #dcb682); --tile-line: transparent; --tile-filled: #a77b48; --tile-radius: 8px;
  --tile-shadow: 0 4px 0 #a8794a, inset 0 1px 0 rgba(255,255,255,.55); --state-shadow: 0 4px 0 rgba(60,35,15,.35);
  --tile-font: "Zilla Slab", Georgia, serif; --tile-weight: 700; --tile-size: 2rem;
  --title-font: "Zilla Slab", Georgia, serif; --title-weight: 700; --title-size: 1.9rem; --accent: #b8352c;
}
/* Noční tabule: zelená tabule, křída, dřevěný rám */
:root[data-skin="tabule"] {
  --bg: #1e3a2c; --page: radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.07), transparent 55%), radial-gradient(ellipse at 80% 85%, rgba(255,255,255,.05), transparent 50%);
  --surface: #26473a; --ink: #f2f1ea; --muted: #a9bfb2; --line: rgba(242,241,234,.28); --key: rgba(242,241,234,.1); --key-radius: 5px;
  --hit: #7ccf86; --near: #f0cf5e; --miss: rgba(242,241,234,.16); --on-hit: #13261c; --on-near: #13261c; --on-miss: #e6e5dc;

  color-scheme: dark;
}
/* Moderní: sytě modrá noc, zaoblené 3D dlaždice */
:root[data-skin="moderni"] {
  --bg: #121735; --page: radial-gradient(circle at 15% 0%, #2b3176 0, transparent 45%), radial-gradient(circle at 100% 100%, #0e3f50 0, transparent 45%);
  --surface: #1d2350; --ink: #f4f6ff; --muted: #9aa3d4; --line: #343c78; --key: #2b3271; --key-shadow: 0 4px 0 #161b45; --key-radius: 10px;
  --hit: #22c47a; --near: #ffb21e; --miss: #464e88; --on-hit: #ffffff; --on-near: #2a1c00; --on-miss: #ffffff;

  --tile-shadow: inset 0 -5px 0 rgba(0,0,0,.28); --state-shadow: inset 0 -5px 0 rgba(0,0,0,.22);
  --tile-font: "Fredoka", "Segoe UI", sans-serif; --tile-weight: 700; --tile-size: 2rem;
  --title-font: "Fredoka", "Segoe UI", sans-serif; --title-weight: 700; --title-size: 1.85rem; --accent: #ffb21e;
  color-scheme: dark;
}
:root.cb { --hit: #e3742b; --near: #3d8fd6; --on-hit: #ffffff; --on-near: #ffffff; }
/* Volitelná červená pro písmena, která ve slově nejsou (vypnutá v režimu pro barvoslepé) */
:root.red { --miss: #b5544a; --on-miss: #ffffff; }
@media (prefers-color-scheme: dark) { :root.red:not([data-skin]) { --miss: #8e3f38; } }
:root.red[data-skin="sesit"] { --miss: #f4b4aa; --on-miss: #1f2f6b; }
:root.red[data-skin="klasika"] { --miss: #a8483a; --on-miss: #fff8ec; }
:root.red[data-skin="tabule"] { --miss: #e39a95; --on-miss: #13261c; }
:root.red[data-skin="moderni"] { --miss: #d9536a; --on-miss: #ffffff; }
html, body { height: 100%; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--page), var(--bg); background-color: var(--bg); background-attachment: fixed; color: var(--ink); font: 15px var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  box-sizing: border-box; -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
.app { max-width: 500px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; gap: 12px; padding-block: 12px 12px; box-sizing: border-box; }
header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { font: var(--title-weight) var(--title-size)/1 var(--title-font); margin: 0; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
h1 .dot { color: var(--accent); }
h1 .mark { width: 30px; height: 30px; flex: none; }
:root[data-skin="tabule"] body::after { content: ""; position: fixed; inset: 0; border: 7px solid #7a5532; box-shadow: inset 0 0 0 2px #5c3e22, inset 0 0 40px rgba(0,0,0,.35); pointer-events: none; z-index: 5; }
.icons { display: flex; gap: 6px; }
.ib {
  width: 38px; height: 38px; display: grid; place-items: center; padding: 0;
  font: 800 1rem var(--display); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 50%; cursor: pointer;
}
.ib svg { width: 19px; height: 19px; }
.ib:hover { border-color: var(--muted); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--near); outline-offset: 2px; }

.tabs { display: flex; gap: 4px; background: var(--key); padding: 4px; border-radius: 999px; align-self: center; }
.tab { font: 700 0.85rem var(--body); color: var(--muted); background: transparent; border: 0; padding: 7px 16px; border-radius: 999px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.status { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 10px; color: var(--muted); font-size: 0.85rem; min-height: 1.3em; margin: -2px 0 0; text-align: center; }
.status b { color: var(--ink); }
.link { font: 700 0.85rem var(--body); color: var(--link); background: none; border: 0; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
.link:disabled { color: var(--muted); text-decoration: none; cursor: default; }
.tagrow { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; min-height: 0; }
.tag { font-size: 0.72rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; }
.tag.hintag { color: var(--ink); border-color: var(--near); }

.board-wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
.board { display: grid; grid-template-rows: repeat(6, 1fr); gap: 6px; width: min(100%, 320px); }
.row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.tile { aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; font: var(--tile-weight) calc(var(--tile-size) * var(--tile-scale, 1))/1 var(--tile-font); border: 2px var(--tile-style) var(--tile-line); border-radius: var(--tile-radius); background: var(--tile-bg); box-shadow: var(--tile-shadow); text-shadow: var(--tile-glow); color: var(--ink); user-select: none; box-sizing: border-box; }
.tile.filled { border-color: var(--tile-filled); animation: pop .1s ease-out; }
.tile.hit  { background: var(--hit);  border: 2px solid var(--hit);  color: var(--on-hit);  box-shadow: var(--state-shadow); text-shadow: none; }
.tile.near { background: var(--near); border: 2px solid var(--near); color: var(--on-near); box-shadow: var(--state-shadow); text-shadow: none; }
.tile.miss { background: var(--miss); border: 2px solid transparent; color: var(--on-miss); box-shadow: var(--state-shadow); text-shadow: none; }
.tile.flip { animation: flip .45s ease-in-out both; }
.row.shake { animation: shake .4s; }
.tile.win { animation: hop .5s ease both; }
@keyframes pop { 50% { transform: scale(1.08); } }
@keyframes flip { 50% { transform: rotateX(90deg); } }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
@keyframes hop { 40% { transform: translateY(-14px); } }

.kb { display: flex; flex-direction: column; gap: 6px; user-select: none; }
.kr { display: flex; gap: 4px; justify-content: center; }
.key { flex: 1 1 0; min-width: 0; height: 50px; max-width: 44px; font: 700 1rem var(--body); color: var(--key-ink); background: var(--key); box-shadow: var(--key-shadow); border: 0; border-radius: var(--key-radius); cursor: pointer; padding: 0; display: grid; place-items: center; }
.key.wide { max-width: 68px; flex-grow: 1.6; font-size: 0.85rem; letter-spacing: 0.01em; }
.key.diac { height: 40px; }
.key.hit  { background: var(--hit);  color: var(--on-hit); }
.key.near { background: var(--near); color: var(--on-near); }
.key.miss { background: var(--miss); color: var(--on-miss); opacity: .7; }
.key:active { transform: translateY(2px); box-shadow: none; }

.toast { position: fixed; left: 50%; top: calc(150px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); font-weight: 700; padding: 10px 16px; border-radius: 8px; z-index: 40; pointer-events: none; max-width: calc(100% - 32px); text-align: center; box-sizing: border-box; }

.sheet-bg { position: fixed; inset: 0; background: rgba(10, 14, 22, .55); z-index: 30; display: grid; place-items: center; padding: 16px; }
.sheet { background: var(--surface); color: var(--ink); border-radius: 14px; padding: 22px; width: min(100%, 400px); max-height: calc(100vh - 40px); overflow: auto; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 50px rgba(0,0,0,.3); box-sizing: border-box; }
.sheet h2 { font: var(--title-weight) 1.5rem var(--title-font); margin: 0; text-wrap: balance; }
.sheet p { margin: 0; line-height: 1.5; color: var(--muted); }
.answer { font: var(--tile-weight) 1.7rem var(--tile-font); letter-spacing: .12em; }
.mean { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 10px; background: var(--bg); }
.sheet .mean .def { color: var(--ink); font-size: 1rem; }
.refs { font-size: .82rem; color: var(--muted); }
.refs a { color: var(--link); font-weight: 700; }
.fld { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: .9rem; }
.fld input, .linkbox { font: 700 1.1rem var(--body); color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; box-sizing: border-box; }
#chWord { font: 800 1.5rem var(--display); letter-spacing: .2em; text-transform: uppercase; }
.fld input:focus { border-color: var(--hit); outline: none; }
.linkbox { font: 400 .85rem var(--body); }
.sheet .err { color: #c2412d; font-weight: 700; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
.stats b { display: block; font: 800 1.6rem var(--display); font-variant-numeric: tabular-nums; }
.stats span { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.dist { display: flex; flex-direction: column; gap: 4px; }
.bar { display: grid; grid-template-columns: 14px 1fr; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; font-size: .85rem; }
.bar i { display: block; background: var(--key); color: var(--key-ink); font-style: normal; font-weight: 700; padding: 2px 6px; border-radius: 3px; text-align: right; min-width: 22px; box-sizing: border-box; }
.calhead { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
.calhead b { font: var(--title-weight) 1.1rem var(--title-font); }
.calhead .ib { width: 34px; height: 34px; font-size: 1.2rem; }
.calhead .ib:disabled { opacity: .35; cursor: default; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal .wd { font-size: .7rem; font-weight: 700; color: var(--muted); text-transform: uppercase; padding-bottom: 2px; }
.cal .cd { aspect-ratio: 1; display: grid; place-items: center; border-radius: 8px; font-size: .85rem; font-variant-numeric: tabular-nums; background: var(--bg); color: var(--ink); }
.cal .cd.off { opacity: .35; background: none; }
.cal .cd.won { background: var(--hit); color: var(--on-hit); font-weight: 700; }
.cal .cd.lost { background: var(--miss); color: var(--on-miss); font-weight: 700; }
.cal .cd.part { box-shadow: inset 0 0 0 2px var(--near); }
.cal .cd.now { outline: 2px solid var(--ink); outline-offset: 1px; }
.callegend { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; font-size: .78rem; color: var(--muted); }
.callegend span { display: flex; align-items: center; gap: 5px; }
.callegend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.callegend i.won { background: var(--hit); } .callegend i.lost { background: var(--miss); } .callegend i.part { box-shadow: inset 0 0 0 2px var(--near); }
a.secondary.dl { display: grid; place-items: center; text-decoration: none; }
.bar i.now { background: var(--hit); color: var(--on-hit); }
.primary, .secondary { flex: 1; font: 700 1rem var(--body); border: 0; border-radius: 10px; padding: 12px; cursor: pointer; }
.primary { background: var(--hit); color: var(--on-hit); }
.secondary { background: var(--key); color: var(--ink); }
.row-btns { display: flex; gap: 8px; }
.links { display: flex; justify-content: center; gap: 22px; flex-wrap: wrap; }
.imgprev { width: 100%; border-radius: 12px; border: 1px solid var(--line); display: block; }
.countdown { text-align: center; color: var(--muted); font-size: 0.9rem; }
.countdown b { display: block; font: 800 1.6rem var(--display); color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.legend { display: flex; flex-direction: column; gap: 8px; }
.legend div { display: flex; align-items: center; gap: 10px; }
.legend .tile { width: 34px; font-size: 1.1rem; flex: none; }
.copybox { width: 100%; min-height: 120px; font: 1rem/1.3 var(--body); background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; box-sizing: border-box; }

.opt { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding-block: 10px; border-bottom: 1px solid var(--line); cursor: pointer; }
.opt:last-of-type { border-bottom: 0; }
.opt strong { display: block; }
.opt small { color: var(--muted); font-size: .82rem; line-height: 1.4; display: block; }
.sw { appearance: none; -webkit-appearance: none; flex: none; width: 46px; height: 28px; border-radius: 999px; background: var(--key); position: relative; cursor: pointer; margin: 0; transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .2s; }
.sw:checked { background: var(--hit); }
.sw:checked::after { transform: translateX(18px); }
.sw:disabled { opacity: .45; cursor: not-allowed; }
.langs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.langbtn { display: block; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--line); color: var(--ink); text-decoration: none; font-weight: 700; text-align: center; }
.langbtn[aria-current="true"] { border-color: var(--hit); box-shadow: 0 0 0 2px var(--hit); }
.skins { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.skin { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; padding: 10px; border-radius: 12px; border: 2px solid var(--line); background: none; color: var(--ink); cursor: pointer; text-align: left; font: 700 .9rem var(--body); }
.skin:last-child:nth-child(odd) { grid-column: 1 / -1; }
.skin[aria-pressed="true"] { border-color: var(--hit); box-shadow: 0 0 0 2px var(--hit); }
.skin .pv { display: flex; gap: 4px; padding: 8px; border-radius: 8px; width: 100%; box-sizing: border-box; justify-content: center; }
.skin .pv i { width: 24px; height: 24px; display: grid; place-items: center; font-style: normal; font-size: 15px; font-weight: 700; border-radius: 4px; }
.sheet h3 { margin: 4px 0 -4px; font: 700 .78rem var(--body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 45; }

.arch { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 6px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 2px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; font: 800 1.05rem var(--display); }
.day small { font: 400 .68rem var(--body); color: var(--muted); }
.day.won { background: var(--hit); border-color: var(--hit); color: var(--on-hit); }
.day.lost { background: var(--miss); border-color: var(--miss); color: var(--on-miss); }
.day.won small, .day.lost small { color: inherit; opacity: .85; }
.day.part { border-color: var(--near); }
.day.today { outline: 2px dashed var(--muted); outline-offset: 2px; }

@media (max-height: 660px) { .key { height: 44px; } .key.diac { height: 34px; } :root { --tile-scale: .8; } .board { width: min(100%, 260px); } }

/* Velké obrazovky: hra jako jeden blok uprostřed, větší dlaždice a klávesy, přehled vpravo */
.stage { min-height: 100%; }
.side, .side-left { display: none; }
@media (min-width: 760px) and (min-height: 800px) {
  :root { --tile-scale: 1.35; }
  .stage { height: 100%; }
  .app { max-width: 560px; height: 100%; min-height: 0; justify-content: center; gap: 18px; padding-block: 28px; }
  .board-wrap { flex: 0 1 auto; }
  .board, .row { gap: 8px; }
  .board { width: clamp(300px, calc((100vh - 500px) / 1.2), 470px); }
  h1 { font-size: calc(var(--title-size) * 1.15); }
  h1 .mark { width: 36px; height: 36px; }
  .ib { width: 44px; height: 44px; }
  .tab { font-size: .95rem; padding: 8px 20px; }
  .status { font-size: .95rem; }
  .kb { gap: 8px; }
  .kr { gap: 6px; }
  .key { height: 58px; max-width: 52px; font-size: 1.15rem; }
  .key.diac { height: 46px; }
  .key.wide { max-width: 92px; font-size: 1rem; }
}
@media (min-width: 1180px) and (min-height: 800px) {
  .stage { display: grid; grid-template-columns: 1fr minmax(0, 560px) 1fr; column-gap: 40px; }
  .stage > .app { grid-column: 2; grid-row: 1; width: 100%; }
  .side-left { grid-column: 1; grid-row: 1; justify-self: end; align-self: center; display: flex; flex-direction: column; gap: 12px; width: 220px; }
  .kb .key.wide { display: none; }
  .side { grid-column: 3; grid-row: 1; display: flex; flex-direction: column; gap: 18px; align-self: center; max-width: 290px; padding: 22px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
}
.side h2 { font: var(--title-weight) 1.35rem/1.2 var(--title-font); margin: 0; }
.side .sub { margin: 2px 0 0; color: var(--muted); font-size: .9rem; }
.side .cd { font: 800 1.9rem var(--display); font-variant-numeric: tabular-nums; letter-spacing: .03em; }
.side .lbl { font-size: .72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.side .stats { grid-template-columns: repeat(2, 1fr); row-gap: 12px; }
.side .legend { font-size: .88rem; gap: 6px; }
.side .legend .tile { width: 28px; font-size: .95rem; --tile-scale: 1; }
.side .primary { flex: none; }
.bigbtn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 72px; border: 0; border-radius: 16px; cursor: pointer; font: 800 1.35rem var(--display); box-shadow: var(--key-shadow); }
.bigbtn svg { width: 26px; height: 26px; }
.bigbtn.go { background: var(--hit); color: var(--on-hit); }
.bigbtn.del { background: var(--key); color: var(--key-ink); height: 60px; font-size: 1.15rem; }
.bigbtn:active { transform: translateY(2px); box-shadow: none; }
.bigbtn:disabled { opacity: .45; cursor: default; }
.lefthead { margin: 0 4px 2px; font: var(--title-weight) 1.25rem/1.25 var(--title-font); color: var(--ink); text-align: center; text-wrap: balance; }
.kbhint { margin: 2px 4px 0; color: var(--muted); font-size: .85rem; line-height: 1.4; text-align: center; }
.side .mean { background: var(--bg); }
.side .answer { font-size: 1.4rem; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = document.createElement('canvas'); cv.id = 'confetti'; document.body.appendChild(cv);
  const ctx = cv.getContext('2d'), dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = cv.width = innerWidth * dpr, H = cv.height = innerHeight * dpr;
  const cs = getComputedStyle(document.documentElement);
  const cols = ['--hit', '--near', '--accent', '--tile-filled'].map(v => cs.getPropertyValue(v).trim()).filter(Boolean);
  const parts = Array.from({ length: 140 }, (_, i) => ({
    x: W / 2 + (Math.random() - .5) * W * .3, y: H * .35 + (Math.random() - .5) * 40 * dpr,
    vx: (Math.random() - .5) * 16 * dpr, vy: (-Math.random() * 15 - 6) * dpr,
    w: (5 + Math.random() * 6) * dpr, h: (8 + Math.random() * 8) * dpr,
    r: Math.random() * 6.28, vr: (Math.random() - .5) * .35, c: cols[i % cols.length]
  }));
  const t0 = performance.now();
  (function frame(t) {
    const age = t - t0; ctx.clearRect(0, 0, W, H);
    for (const p of parts) {
      p.vy += .45 * dpr; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.max(0, 1 - age / 2600);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 1.7)) + 1); ctx.restore();
    }
    if (age < 2600) requestAnimationFrame(frame); else cv.remove();
  })(t0);
}

let actx;
function tone(freq, dur = 0.06, type = 'sine', vol = 0.05, delay = 0) {
  if (!settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
  } catch {}
}
function buzz(p) { if (settings.sound && navigator.vibrate) try { navigator.vibrate(p); } catch {} }

  win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, 'triangle', 0.06, i * 0.11)); buzz([20, 60, 20, 60, 40]); },

function target() { return [...(game.easy ? strip(game.answer) : game.answer)]; }
function startGame(kind, day, chal) {

  ctx.fillStyle = v('--bg'); ctx.fillRect(0, 0, S, S);
  ctx.fillStyle = v('--surface'); rr(ctx, 60, 60, S - 120, S - 120, 44); ctx.fill();
  // logo
  ctx.fillStyle = v('--hit'); rr(ctx, 120, 130, 96, 88, 22); ctx.fill();
  ctx.strokeStyle = v('--near'); ctx.lineWidth = 12; ctx.lineCap = ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(140, 112); ctx.lineTo(168, 132); ctx.lineTo(196, 112); ctx.stroke();
  ctx.fillStyle = v('--on-hit'); ctx.font = `700 62px ${tileFont}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('S', 168, 178);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = v('--ink'); ctx.font = `${v('--title-weight') || 800} 66px ${titleFont}`; ctx.fillText('Słówko', 244, 192);
  ctx.fillStyle = v('--muted'); ctx.font = `700 34px ${v('--body')}`;
  const sub = g.kind === 'challenge' ? `Wyzwanie${g.from ? ' od ' + g.from : ''}` : g.kind === 'train' ? 'Trening' : `nr ${g.day + 1} · ${dateFor(g.day)} ${new Date(EPOCH + g.day * 864e5).getUTCFullYear()}`;
  ctx.fillText(sub, 246, 240);
  ctx.textAlign = 'right'; ctx.fillStyle = g.won ? v('--hit') : v('--ink'); ctx.font = `800 96px ${v('--display')}`;
  ctx.fillText(`${g.won ? g.guesses.length : 'X'}/6`, S - 120, 218);
  const marks = [g.hard && 'tryb trudny', g.easy && 'bez polskich znaków', g.hint != null && 'z podpowiedzią'].filter(Boolean).join(' · ');
  if (marks) { ctx.fillStyle = v('--muted'); ctx.font = `700 28px ${v('--body')}`; ctx.fillText(marks, S - 120, 262); }
  // grid
  const tile = 96, gap = 14, gw = 5 * tile + 4 * gap, x0 = (S - gw) / 2, rows = g.results.length;
  const gh = rows * tile + (rows - 1) * gap, y0 = 310 + (620 - gh) / 2;
  const col = { hit: v('--hit'), near: v('--near'), miss: v('--miss') };
  g.results.forEach((res, r) => res.forEach((x, i) => { ctx.fillStyle = col[x]; rr(ctx, x0 + i * (tile + gap), y0 + r * (tile + gap), tile, tile, 16); ctx.fill(); }));
  ctx.textAlign = 'center'; ctx.fillStyle = v('--muted'); ctx.font = `700 30px ${v('--body')}`;
  ctx.fillText('prejzajda-max.github.io/Slovicko/pl', S / 2, S - 110);

}
async function showImage() {
  const cv = await drawResult(), url = cv.toDataURL('image/png');
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  const mobile = matchMedia('(pointer: coarse)').matches;
  openSheet(`<h2>Obrazek z wynikiem</h2><img class="imgprev" src="${url}" alt="Obrazek z wynikiem gry, bez zdradzania słowa">
    <div class="row-btns"><button class="primary" id="imgSend">${mobile ? 'Udostępnij' : 'Kopiuj'}</button><a class="secondary dl" id="imgDl" href="${url}" download="slovicko-${game.kind === 'daily' ? 'c' + (game.day + 1) : game.kind}.png">Pobierz</a></div>
    <button class="link" id="closeBtn">Zamknij</button>`);
  track('sdileni-obrazku', 'Sdílení obrázku');
  on('closeBtn', closeSheet);
  on('imgSend', async () => {
    const file = new File([blob], 'slovicko.png', { type: 'image/png' });
    if (mobile && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); toast('Obrazek skopiowany, wklej go przez Ctrl+V'); }
    catch { toast('Kopiowanie obrazka nie działa, użyj Pobierz'); }
  });
}
function showArchive() {
  const today = todayIndex();
  let cells = '';
  for (let d = today; d >= 0; d--) {
    const rec = games[d]; let cls = 'day';
    if (rec && rec.g && rec.g.length) {
      const t = [...(rec.easy ? strip(wordFor(d)) : wordFor(d))];
      const solved = rec.g.some(x => x === t.join(''));
      cls += solved ? ' won' : rec.g.length >= ROWS ? ' lost' : ' part';
    }
    if (d === today) cls += ' today';
    cells += `<button class="${cls}" data-day="${d}" aria-label="Słówko ${d + 1} z ${dateFor(d)}">${d + 1}<small>${d === today ? 'dziś' : dateFor(d)}</small></button>`;
  }
  openSheet(`<h2>Archiwum</h2>
    <p>${today === 0 ? 'Na razie jest tu tylko dzisiejsze słówko. Od jutra znajdziesz tu wszystkie, które przegapisz.' : 'Wybierz dzień i dokończ przegapione słówko. Zielone są odgadnięte, szare przegrane, z żółtą ramką rozpoczęte.'}</p>
    <div class="arch" id="arch">${cells}</div>
    <button class="secondary" id="closeBtn">Zamknij</button>`);
  document.getElementById('arch').onclick = e => {
    const b = e.target.closest('.day'); if (!b) return;
    const d = +b.dataset.day; closeSheet();
    startGame(d === todayIndex() ? 'daily' : 'archive', d);
    if (game.over) setTimeout(showEnd, 200);
  };
  on('closeBtn', closeSheet);
}
function showSettings() {
  const locked = game.guesses.length > 0 && !game.over;
  const row = (id, title, desc, checked, dis) => `<label class="opt" for="${id}"><span><strong>${title}</strong><small>${desc}</small></span><input type="checkbox" class="sw" id="${id}" ${checked ? 'checked' : ''} ${dis ? 'disabled' : ''}></label>`;
  const skinBtns = SKINS.map(s => `<button class="skin" data-skin="${s.id}" aria-pressed="${s.id === settings.skin}">
      <span class="pv" style="background:${s.bg}"><i style="background:${s.hit};color:${s.on};font-family:${s.font}">S</i><i style="background:${s.near};color:${s.on};font-family:${s.font}">L</i><i style="background:${s.miss};color:${s.on};font-family:${s.font}">O</i><i style="background:${s.tile};color:${s.ink};font-family:${s.font};outline:1px solid ${s.ink}33">V</i></span>${s.name}</button>`).join('');
  openSheet(`<h2>Ustawienia</h2>
    <h3>Wygląd</h3>
    <div class="skins" id="skins">${skinBtns}</div>
    <h3>Język</h3>
    <div class="langs">${LANGS.map(l => `<a class="langbtn" href="${ROOT}${l.code === 'cs' ? '' : l.code + '/'}" ${l.code === LANG ? 'aria-current="true"' : ''}>${l.name}</a>`).join('')}</div>
    <h3>Gra</h3>
    <div>
      ${row('optEasy', 'Bez polskich znaków', 'Ogonki i kreski się nie liczą, A i Ą to ta sama litera. Klawiatura się uprości.', settings.easy, locked)}
      ${row('optHard', 'Tryb trudny', 'Odgadnięte litery musisz użyć w każdej kolejnej próbie.', settings.hard, locked)}
      ${row('optRed', 'Czerwony dla brakujących liter', settings.cb ? 'Nie łączy się z kolorami dla daltonistów.' : 'Litery, których nie ma w słowie, będą czerwone zamiast szarych.', settings.red, settings.cb)}
      ${row('optCb', 'Kolory dla daltonistów', 'Pomarańczowy i niebieski zamiast zielonego i żółtego.', settings.cb, false)}
      ${row('optSound', 'Dźwięki i wibracje', 'Klikanie klawiszy, dźwięki przy odkrywaniu i wibracje na telefonie.', settings.sound, false)}
    </div>
    ${locked ? '<p>Tryb bez polskich znaków i tryb trudny można zmienić tylko przed pierwszą próbą.</p>' : ''}
    <button class="primary" id="closeBtn">Gotowe</button>`);
  const bind = (id, key, after) => { document.getElementById(id).onchange = e => { settings[key] = e.target.checked; store.set('slovicko-nastaveni', settings); after && after(); }; };
  const applyMode = () => { if (!game.guesses.length && !game.over) { game.easy = settings.easy; game.hard = settings.hard; game.current = []; buildBoard(); buildKb(); updateStatus(); } };
  bind('optEasy', 'easy', applyMode); bind('optHard', 'hard', applyMode);
  document.getElementById('skins').onclick = e => {
    const b = e.target.closest('.skin'); if (!b) return;
    settings.skin = b.dataset.skin; store.set('slovicko-nastaveni', settings); applySkin(); track('vzhled-' + settings.skin, 'Zvolený vzhled: ' + settings.skin); tone(740, 0.05);
    document.querySelectorAll('.skin').forEach(x => x.setAttribute('aria-pressed', x === b));
  };
  bind('optRed', 'red', applyCb);
  bind('optCb', 'cb', () => { applyCb(); const r = document.getElementById('optRed'); if (r) { r.disabled = settings.cb; r.closest('.opt').querySelector('small').textContent = settings.cb ? 'Nie łączy się z kolorami dla daltonistów.' : 'Litery, których nie ma w słowie, będą czerwone zamiast szarych.'; } }); bind('optSound', 'sound', () => settings.sound && tone(660, 0.05));
  on('closeBtn', closeSheet);
}
function showHelp() {
  openSheet(`<h2>Jak grać</h2>
    <p>Każdego dnia jest jedno nowe słówko, takie samo dla wszystkich. Wpisz polskie słowo z 5 liter i zatwierdź przyciskiem Zgadnij. Polskie znaki liczą się jako osobne litery, chyba że w ustawieniach włączysz grę bez polskich znaków.</p>
    <div class="legend">
      <div><span class="tile hit">K</span> litera jest w słowie na właściwym miejscu</div>
      <div><span class="tile near">O</span> litera jest w słowie, ale gdzie indziej</div>
      <div><span class="tile miss">Z</span> litery nie ma w słowie</div>
    </div>
    <p>Szukane słowa to popularne rzeczowniki. Jako próbę możesz wpisać dowolną formę istniejącego słowa. Raz na grę możesz wziąć podpowiedź, która odkryje jedną literę.</p>
    <p>W zakładce Wyzwanie wymyślisz własne słowo i wyślesz je znajomemu jako link.</p>
    <p>Na telefonie możesz dodać grę do ekranu głównego przez menu przeglądarki „Dodaj do ekranu głównego”.</p>
    <button class="primary" id="closeBtn">Gramy</button>`);
  on('closeBtn', closeSheet);
}


// ---------- boční přehled na velkých obrazovkách ----------
const sideEl = document.getElementById('side');
const wideMq = matchMedia('(min-width: 1180px) and (min-height: 800px)');
function renderSide() {
  if (!wideMq.matches) { sideEl.innerHTML = ''; return; }
  const today = todayIndex(), pct = stats.played ? Math.round(stats.won / stats.played * 100) : 0;
  const dailyOver = game.kind === 'daily' && game.over;
  sideEl.innerHTML = `
    <div><h2>Słówko nr ${today + 1}</h2><p class="sub">${dateFor(today)} ${new Date().getFullYear()}</p></div>
    <div><div class="lbl">Następne słowo za</div><div class="cd" id="sideCd">${untilMidnight()}</div></div>
    <div class="stats">
      <div><b>${stats.played}</b><span>Gier</span></div><div><b>${pct}%</b><span>Wygranych</span></div>
      <div><b>${stats.streak}</b><span>Seria</span></div><div><b>${stats.best}</b><span>Najlepsza</span></div>
    </div>
    ${dailyOver ? meaningBlock(game.answer) + '<div class="row-btns"><button class="primary" id="sideShare">Udostępnij wynik</button><button class="secondary" id="sideImg">Obrazek</button></div>' : ''}
    <div class="legend">
      <div><span class="tile hit">K</span> właściwe miejsce</div>
      <div><span class="tile near">O</span> w słowie, ale gdzie indziej</div>
      <div><span class="tile miss">Z</span> nie ma w słowie</div>
    </div>
    <button class="secondary" id="sideChal">Wyślij wyzwanie znajomemu</button>`;
  on('sideShare', share); on('sideImg', showImage); on('sideChal', showMakeChallenge);
  renderLeft();
}
const ICON = {
  go: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
  del: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1zM18 9l-6 6M12 9l6 6"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>'
};
function renderLeft() {
  const el = document.getElementById('sideLeft'); if (!el) return;
  const g = game;
  if (!g.over) {
    el.innerHTML = `<button class="bigbtn go" id="leftEnter">${ICON.go}Zgadnij</button>
      <button class="bigbtn del" id="leftDel">${ICON.del}Usuń</button>
      <p class="kbhint">Na klawiaturze komputera działa też Enter i Backspace.</p>`;
    document.getElementById('leftEnter').onclick = e => { press('ENTER'); e.currentTarget.blur(); };
    document.getElementById('leftDel').onclick = e => { press('⌫'); e.currentTarget.blur(); };
    return;
  }
  const opts = {
    daily:     [['Zagraj trening', () => startGame('train')], ['Archiwum słówek', showArchive], ['Wyślij wyzwanie', showMakeChallenge]],
    archive:   [['Następne z archiwum', showArchive], ['Słowo dnia', () => startGame('daily', todayIndex())], ['Zagraj trening', () => startGame('train')]],
    train:     [['Następne słowo', () => startGame('train')], ['Słowo dnia', () => startGame('daily', todayIndex())], ['Archiwum słówek', showArchive]],
    challenge: [['Własne wyzwanie', showMakeChallenge], ['Słowo dnia', () => startGame('daily', todayIndex())], ['Zagraj trening', () => startGame('train')]]
  }[g.kind];
  el.innerHTML = `<p class="lefthead">${g.won ? 'Gotowe, brawo!' : 'Tym razem nie.'} Co dalej?</p>` +
    opts.map((o, i) => `<button class="bigbtn ${i ? 'del' : 'go'}" data-i="${i}">${i ? '' : ICON.play}${o[0]}</button>`).join('');
  el.querySelectorAll('.bigbtn').forEach(b => b.onclick = () => { closeSheet(); opts[+b.dataset.i][1](); });

setInterval(() => {
  const el = document.getElementById('sideCd'); if (!el) return;
  el.textContent = untilMidnight();
}, 1000);
wideMq.addEventListener ? wideMq.addEventListener('change', renderSide) : wideMq.addListener(renderSide);

document.getElementById('tabDaily').onclick = () => startGame('daily', todayIndex());
document.getElementById('tabTrain').onclick = () => startGame('train');
document.getElementById('tabChal').onclick = showMakeChallenge;
window.addEventListener('hashchange', () => { const c = challengeFromHash(); if (c) { closeSheet(); startGame('challenge', 0, c); } });
document.getElementById('statsBtn').onclick = showStats;
document.getElementById('helpBtn').onclick = showHelp;
document.getElementById('archBtn').onclick = showArchive;
document.getElementById('setBtn').onclick = showSettings;
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && game.kind === 'daily' && game.day !== todayIndex() && !game.busy) { closeSheet(); startGame('daily', todayIndex()); }
});

const firstChal = challengeFromHash();
if (firstChal) {
  startGame('challenge', 0, firstChal);
  setTimeout(() => toast(firstChal.n ? `${firstChal.n} wysłał(a) ci słowo do odgadnięcia` : 'Znajomy wysłał ci słowo do odgadnięcia'), 400);
  store.set(KP + 'seen', true);
} else {
  startGame('daily', todayIndex());
  if (!store.get(KP + 'seen', false)) { store.set(KP + 'seen', true); setTimeout(showHelp, 300); }
